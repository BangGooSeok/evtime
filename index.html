<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기차 충전 소요시간 계산기</title>

    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #14171f;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --accent-red: #e82127;
            --charge-green: #10b981;
            --charge-target: #f59e0b;
            --input-bg: #1f2937;
            --input-border: #374151;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid #232836;
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 배터리 */
        .battery-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .battery-outer {
            width: 180px;
            height: 90px;
            border: 4px solid #374151;
            border-radius: 14px;
            padding: 4px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .battery-outer::after {
            content: "";
            position: absolute;
            right: -12px;
            top: 25px;
            width: 8px;
            height: 40px;
            background: #374151;
            border-radius: 0 6px 6px 0;
        }

        .battery-inline {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            background: #1f2937;
        }

        .fill-current {
            height: 100%;
            background: linear-gradient(
                90deg,
                #059669,
                var(--charge-green)
            );
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        .fill-target {
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(245, 158, 11, 0.4) 25%,
                rgba(245, 158, 11, 0.2) 25%,
                rgba(245, 158, 11, 0.2) 50%,
                rgba(245, 158, 11, 0.4) 50%,
                rgba(245, 158, 11, 0.4) 75%,
                rgba(245, 158, 11, 0.2) 75%,
                rgba(245, 158, 11, 0.2) 100%
            );
            background-size: 20px 20px;
            animation: barberPole 1.5s linear infinite;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        @keyframes barberPole {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 20px 0;
            }
        }

        /* 입력 */
        .control-group {
            margin-bottom: 22px;
        }

        .control-label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            background: #2d3139;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .num-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 85px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 8px 32px 8px 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .unit-badge {
            position: absolute;
            right: 8px;
            font-size: 11px;
            color: var(--text-muted);
            pointer-events: none;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 결과 */
        .display-panel {
            margin-top: 30px;
            background: #090b0f;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
        }

        .display-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .panel-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .panel-value {
            font-size: 18px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .panel-value.highlight {
            grid-column: span 2;
            margin-top: 5px;
            border-top: 1px solid #1f2937;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .time-box {
            text-align: right;
        }

        #view-time {
            font-size: 26px;
            color: var(--accent-blue);
            text-align: right;
        }

        #view-completion {
            font-size: 22px;
            color: var(--charge-target);
        }

        #current-now {
            font-size: 16px;
            color: #9ca3af;
            font-variant-numeric: tabular-nums;
        }

        .date-small {
            display: block;
            font-size: 11px;
            color: #6b7280;
            font-weight: normal;
            margin-bottom: 2px;
        }

        #warning {
            color: var(--accent-red);
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <h2>충전 소요시간 계산기</h2>

    <div class="battery-container">
        <div class="battery-outer">
            <div class="battery-inline">
                <div id="bat-current" class="fill-current"></div>
                <div id="bat-target" class="fill-target"></div>
            </div>
        </div>
    </div>

    <!-- 배터리 용량 -->
    <div class="control-group">
        <div class="control-label">배터리 용량</div>

        <div class="input-row">

            <input
                type="range"
                id="capacity"
                min="50"
                max="120"
                value="81.6"
                step="0.1"
                oninput="syncInputs('capacity', 'slider')"
            >

            <div class="num-input-wrapper">

                <input
                    type="number"
                    id="capacity-num"
                    value="81.6"
                    min="50"
                    max="120"
                    step="0.1"
                    oninput="syncInputs('capacity', 'num')"
                    onblur="clampInput('capacity')"
                >

                <span class="unit-badge">kWh</span>
            </div>

        </div>
    </div>

    <!-- 현재 잔량 -->
    <div class="control-group">
        <div class="control-label">현재 배터리 잔량</div>

        <div class="input-row">

            <input
                type="range"
                id="current"
                min="0"
                max="100"
                value="35"
                step="1"
                oninput="syncInputs('current', 'slider')"
            >

            <div class="num-input-wrapper">

                <input
                    type="number"
                    id="current-num"
                    value="35"
                    min="0"
                    max="100"
                    step="1"
                    oninput="syncInputs('current', 'num')"
                    onblur="clampInput('current')"
                >

                <span class="unit-badge">%</span>
            </div>

        </div>
    </div>

    <!-- 목표 충전량 -->
    <div class="control-group">
        <div class="control-label">목표 충전량</div>

        <div class="input-row">

            <input
                type="range"
                id="target"
                min="0"
                max="100"
                value="100"
                step="1"
                oninput="syncInputs('target', 'slider')"
            >

            <div class="num-input-wrapper">

                <input
                    type="number"
                    id="target-num"
                    value="100"
                    min="0"
                    max="100"
                    step="1"
                    oninput="syncInputs('target', 'num')"
                    onblur="clampInput('target')"
                >

                <span class="unit-badge">%</span>
            </div>

        </div>
    </div>

    <!-- 충전기 출력 -->
    <div class="control-group">
        <div class="control-label">충전기 출력</div>

        <div class="input-row">

            <input
                type="range"
                id="power"
                min="1"
                max="11"
                value="7"
                step="0.1"
                oninput="syncInputs('power', 'slider')"
            >

            <div class="num-input-wrapper">

                <input
                    type="number"
                    id="power-num"
                    value="7"
                    min="1"
                    max="11"
                    step="0.1"
                    oninput="syncInputs('power', 'num')"
                    onblur="clampInput('power')"
                >

                <span class="unit-badge">kW</span>
            </div>

        </div>
    </div>

    <!-- 충전 효율 -->
    <div class="control-group">
        <div class="control-label">충전 효율</div>

        <div class="input-row">

            <input
                type="range"
                id="efficiency"
                min="50"
                max="100"
                value="90"
                step="1"
                oninput="syncInputs('efficiency', 'slider')"
            >

            <div class="num-input-wrapper">

                <input
                    type="number"
                    id="efficiency-num"
                    value="90"
                    min="50"
                    max="100"
                    step="1"
                    oninput="syncInputs('efficiency', 'num')"
                    onblur="clampInput('efficiency')"
                >

                <span class="unit-badge">%</span>
            </div>

        </div>
    </div>

    <div id="warning">
        ⚠️ 목표 충전량이 현재 잔량보다 높아야 합니다.
    </div>

    <div class="display-panel">

        <div class="display-grid">

            <div>
                <div class="panel-label">충전 구간</div>
                <div class="panel-value" id="view-range"></div>
            </div>

            <div>
                <div class="panel-label">필요 전력량</div>

                <div class="panel-value">
                    <span id="view-kwh"></span> kWh
                </div>
            </div>

            <div class="panel-value highlight">

                <div class="info-row">

                    <div class="panel-label">
                        현재 시각
                    </div>

                    <div id="current-now"></div>

                </div>

                <div class="info-row">

                    <div
                        class="panel-label"
                        style="color: var(--accent-blue);"
                    >
                        예상 소요시간
                    </div>

                    <div id="view-time"></div>

                </div>

                <div
                    class="info-row"
                    style="
                        border-top: 1px dashed #1f2937;
                        padding-top: 12px;
                    "
                >

                    <div
                        class="panel-label"
                        style="color: var(--charge-target);"
                    >
                        완료 예정 시각
                    </div>

                    <div
                        id="view-completion"
                        class="time-box"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    function syncInputs(id, type) {

        const slider =
            document.getElementById(id);

        const numInput =
            document.getElementById(id + "-num");


        if (type === "slider") {

            numInput.value =
                slider.value;

        } else {

            if (numInput.value !== "") {
                slider.value =
                    numInput.value;
            }

        }


        calculate();
    }


    function clampInput(id) {

        const slider =
            document.getElementById(id);

        const numInput =
            document.getElementById(id + "-num");


        const min =
            parseFloat(slider.min);

        const max =
            parseFloat(slider.max);


        let value =
            parseFloat(numInput.value);


        if (isNaN(value)) {
            value = min;
        }

        if (value < min) {
            value = min;
        }

        if (value > max) {
            value = max;
        }


        numInput.value =
            value;

        slider.value =
            value;


        calculate();
    }


    /*
     * 현재 시각 표시
     *
     * 오후 8:15:23
     */
    function formatCurrentTime(date) {

        return date.toLocaleTimeString(
            "ko-KR",
            {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }
        );
    }


    /*
     * 완료 예정 시각
     *
     * 날짜 + 시:분:초
     */
    function formatCompletionDate(date) {

        const year =
            date.getFullYear();

        const month =
            date.getMonth() + 1;

        const day =
            date.getDate();


        const time =
            date.toLocaleTimeString(
                "ko-KR",
                {
                    hour: "numeric",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            );


        return `
            <span class="date-small">
                ${year}년 ${month}월 ${day}일
            </span>
            ${time}
        `;
    }


    /*
     * 밀리초를
     *
     * 8시간 25분 17초
     *
     * 형식으로 변환
     */
    function formatDuration(milliseconds) {

        /*
         * 계산 결과의 소수점 이하 초도
         * 자연스럽게 반올림
         */
        const totalSeconds =
            Math.round(
                milliseconds / 1000
            );


        const hours =
            Math.floor(
                totalSeconds / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );


        const seconds =
            totalSeconds % 60;


        if (hours > 0) {

            return `${hours}시간 ${minutes}분 ${seconds}초`;

        }


        if (minutes > 0) {

            return `${minutes}분 ${seconds}초`;

        }


        return `${seconds}초`;
    }


    function calculate() {

        const capacity =
            parseFloat(
                document.getElementById("capacity").value
            ) || 0;


        const current =
            parseFloat(
                document.getElementById("current").value
            ) || 0;


        const target =
            parseFloat(
                document.getElementById("target").value
            ) || 0;


        const power =
            parseFloat(
                document.getElementById("power").value
            ) || 0;


        const efficiency =
            parseFloat(
                document.getElementById("efficiency").value
            ) || 0;


        const batCurrent =
            document.getElementById("bat-current");


        const batTarget =
            document.getElementById("bat-target");


        const warning =
            document.getElementById("warning");


        /*
         * calculate()가 실행되는 바로 그 순간의
         * 현재 시간을 사용합니다.
         */
        const now =
            new Date();


        /*
         * 현재 시각은 계속 증가
         */
        document.getElementById("current-now").innerText =
            formatCurrentTime(now);


        /*
         * 현재 배터리 상태 표시
         */
        batCurrent.style.width =
            current + "%";


        /*
         * 목표 충전량이 현재 잔량보다
         * 낮거나 같으면 계산 불가
         */
        if (target <= current) {

            warning.style.display =
                "block";


            batTarget.style.width =
                "0%";


            document.getElementById("view-range").innerText =
                "-";


            document.getElementById("view-kwh").innerText =
                "0.00";


            document.getElementById("view-time").innerText =
                "계산 불가";


            document.getElementById("view-completion").innerHTML =
                "-";


            return;
        }


        warning.style.display =
            "none";


        /*
         * 목표 충전 영역
         */
        batTarget.style.width =
            (target - current) + "%";


        /*
         * 충전해야 할 배터리 에너지
         *
         * 예:
         *
         * 81.6kWh 배터리
         * 35% → 100%
         *
         * 81.6 × 0.65
         */
        const requiredKwh =
            capacity *
            (
                (target - current) / 100
            );


        /*
         * 효율을 적용한 실질 충전 출력
         *
         * 7kW × 90%
         * = 6.3kW
         */
        const actualPower =
            power *
            (
                efficiency / 100
            );


        /*
         * 예상 충전 시간
         *
         * 필요한 에너지 ÷ 실제 충전 출력
         */
        const chargingHours =
            requiredKwh /
            actualPower;


        /*
         * 밀리초 단위 예상 충전시간
         */
        const chargingMilliseconds =
            chargingHours *
            60 *
            60 *
            1000;


        /*
         * 기본 정보
         */
        document.getElementById("view-range").innerText =
            `${current}% → ${target}%`;


        document.getElementById("view-kwh").innerText =
            requiredKwh.toFixed(2);


        /*
         * 예상 소요시간
         *
         * 아직 충전을 시작하지 않았으므로
         * 이 값 자체는 시간이 지나도 변하지 않습니다.
         */
        document.getElementById("view-time").innerText =
            formatDuration(
                chargingMilliseconds
            );


        /*
         * 핵심
         *
         * 완료 예정 시각은 매번
         *
         * 현재 시각 + 예상 충전시간
         *
         * 으로 계산합니다.
         *
         * 따라서 현재 시각이 1초 증가하면
         * 완료 예정 시각도 1초 증가합니다.
         */
        const completionDate =
            new Date(
                now.getTime()
                +
                chargingMilliseconds
            );


        document.getElementById("view-completion").innerHTML =
            formatCompletionDate(
                completionDate
            );
    }


    /*
     * 250ms마다 재계산
     *
     * 초가 바뀌는 시점이 자연스럽게 보이도록
     * 1초보다 조금 짧게 갱신합니다.
     */
    setInterval(
        calculate,
        250
    );


    /*
     * 최초 표시
     */
    window.addEventListener(
        "load",
        calculate
    );

</script>

</body>
</html>
